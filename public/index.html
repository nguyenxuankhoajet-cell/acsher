<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>filedrop — kho file số</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#120a26;--panel:#1c1140;--panel2:#241653;--line:#3a2678;--text:#fbf7ff;--muted:#b7a9e0;
    --pink:#ff3fa4;--cyan:#22e0ff;--lime:#9dff5c;--sans:'Inter',sans-serif;--disp:'Space Grotesk',sans-serif;}
  *{box-sizing:border-box;}
  html,body{margin:0;color:var(--text);font-family:var(--sans);
    background:radial-gradient(circle at 12% 8%,color-mix(in srgb,var(--pink) 35%,transparent),transparent 42%),
      radial-gradient(circle at 88% 18%,color-mix(in srgb,var(--cyan) 28%,transparent),transparent 45%),var(--bg);background-attachment:fixed;}
  header{position:sticky;top:0;background:rgba(18,10,38,.8);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
    padding:14px 24px;display:flex;justify-content:space-between;align-items:center;z-index:10;}
  .logo{font-family:var(--disp);font-weight:700;font-size:19px;}
  .cart-btn{font-family:var(--disp);font-weight:600;font-size:13px;background:linear-gradient(135deg,var(--pink),#a53fff);
    border:none;color:#fff;padding:10px 16px;border-radius:99px;cursor:pointer;}
  .hero{max-width:1040px;margin:60px auto 40px;padding:0 24px;}
  .hero h1{font-family:var(--disp);font-size:clamp(30px,5vw,50px);margin:0 0 14px;
    background:linear-gradient(100deg,#fff 30%,var(--cyan) 60%,var(--pink) 90%);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .hero p{color:var(--muted);font-size:16px;max-width:52ch;}
  main{max-width:1040px;margin:0 auto;padding:0 24px 100px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;}
  .card{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:16px;padding:20px;
    display:flex;flex-direction:column;gap:12px;}
  .card-top{display:flex;justify-content:space-between;}
  .ext{font-family:var(--disp);font-size:12px;font-weight:700;padding:5px 10px;border-radius:8px;background:var(--cyan);color:#0c0620;}
  .price{font-family:var(--disp);font-weight:700;color:var(--lime);}
  .name{font-weight:600;font-size:16px;}
  .desc{color:var(--muted);font-size:13.5px;flex:1;}
  .bottom{display:flex;justify-content:space-between;align-items:center;}
  .size{color:var(--muted);font-family:var(--disp);font-size:12px;}
  .add-btn{font-family:var(--disp);font-weight:600;font-size:13px;background:rgba(255,255,255,.08);border:1px solid var(--line);
    color:var(--text);padding:8px 14px;border-radius:99px;cursor:pointer;}
  .add-btn.added{background:linear-gradient(135deg,var(--cyan),var(--lime));color:#0c0620;border-color:transparent;}
  .overlay{position:fixed;inset:0;background:rgba(8,4,18,.65);opacity:0;pointer-events:none;transition:.2s;z-index:20;}
  .overlay.open{opacity:1;pointer-events:auto;}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(400px,92vw);background:var(--panel);border-left:1px solid var(--line);
    transform:translateX(100%);transition:.25s;z-index:21;display:flex;flex-direction:column;}
  .drawer.open{transform:translateX(0);}
  .drawer-head,.drawer-foot{padding:20px;border-bottom:1px solid var(--line);}
  .drawer-foot{border-top:1px solid var(--line);border-bottom:none;}
  .drawer-items{flex:1;overflow-y:auto;padding:10px 20px;}
  .drawer-item{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);}
  .rm{color:var(--pink);background:none;border:none;cursor:pointer;font-family:var(--disp);font-size:12px;}
  .total-row{display:flex;justify-content:space-between;font-family:var(--disp);font-weight:700;margin-bottom:14px;}
  .checkout-btn{width:100%;background:linear-gradient(135deg,var(--pink),var(--cyan));color:#0c0620;border:none;
    padding:13px;border-radius:99px;font-family:var(--disp);font-weight:700;cursor:pointer;}
  .checkout-btn:disabled{background:var(--panel2);color:var(--muted);}
  .modal-overlay{position:fixed;inset:0;background:rgba(8,4,18,.78);display:none;align-items:center;justify-content:center;z-index:30;padding:20px;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;max-width:420px;width:100%;padding:28px;position:relative;}
  .modal h3{font-family:var(--disp);margin:0 0 6px;}
  .modal p.sub{color:var(--muted);font-size:13px;margin:0 0 18px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-family:var(--disp);}
  .field input,.field select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);
    padding:10px 12px;border-radius:8px;font-family:var(--sans);font-size:14px;}
  .pay-tabs{display:flex;gap:8px;margin-bottom:16px;background:var(--bg);padding:4px;border-radius:99px;}
  .pay-tab{flex:1;text-align:center;font-family:var(--disp);font-size:12px;font-weight:600;padding:8px;border-radius:99px;
    cursor:pointer;color:var(--muted);border:none;background:none;}
  .pay-tab.active{background:linear-gradient(135deg,var(--pink),var(--cyan));color:#0c0620;}
  .close-x{position:absolute;top:16px;right:18px;background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;}
  footer{border-top:1px solid var(--line);padding:24px;text-align:center;color:var(--muted);font-family:var(--disp);font-size:12px;}
  footer a{color:var(--muted);}

  html{-webkit-text-size-adjust:100%;}
  .hright{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end;}
  .bal{font-family:var(--disp);font-weight:700;font-size:14px;background:rgba(157,255,92,.12);border:1px solid var(--lime);
    color:var(--lime);padding:8px 14px;border-radius:99px;white-space:nowrap;}
  .uname{max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:bottom;}
  .ico{display:none;}
  .cart-btn,.add-btn{white-space:nowrap;}
  .modal{max-height:90vh;overflow-y:auto;}

  /* ===== Màn hình lớn (máy tính) ===== */
  @media (min-width:1100px){
    header{padding:18px 48px;}
    .logo{font-size:26px;}
    .cart-btn,.add-btn{font-size:15px;padding:12px 22px;}
    .bal{font-size:16px;padding:10px 18px;}
    .hero{max-width:1240px;margin:80px auto 50px;padding:0 32px;}
    .hero h1{font-size:clamp(48px,4.4vw,68px);}
    .hero p{font-size:20px;max-width:60ch;}
    main{max-width:1240px;padding:0 32px 120px;}
    .grid{grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:26px;}
    .card{padding:28px;gap:16px;border-radius:20px;}
    .ext{font-size:14px;padding:6px 12px;}
    .price{font-size:21px;}
    .name{font-size:20px;}
    .desc{font-size:16px;}
    .size{font-size:14px;}
    .card .add-btn{font-size:15px;padding:11px 20px;}
    .modal{max-width:480px;padding:34px;}
    .drawer{width:min(460px,92vw);}
    footer{font-size:14px;padding:32px;}
  }

  /* ===== Điện thoại ===== */
  @media (max-width:640px){
    header{padding:10px 12px;gap:8px;}
    .logo{font-size:18px;}
    .hright{gap:6px;}
    .cart-btn,.add-btn{font-size:13px;padding:9px 12px;min-height:38px;}
    .bal{font-size:13px;padding:8px 10px;}
    .uname{max-width:80px;}
    .lbl{display:none;}
    .ico{display:inline;}
    .hero{margin:26px auto 20px;padding:0 16px;}
    .hero p{font-size:15px;}
    main{padding:0 16px 80px;}
    .grid{grid-template-columns:1fr;gap:14px;}
    .card{padding:18px;}
    .card .add-btn{padding:10px 18px;}
    .modal-overlay{padding:10px;}
    .modal{padding:22px 18px;}
    .field input,.field select{font-size:16px;padding:12px;}
    .pay-tab{padding:10px 4px;font-size:11.5px;}
    .drawer{width:100vw;}
    .checkout-btn{padding:15px;font-size:15px;}
  }
  @media (max-width:480px){ .uname{display:none;} .logo{font-size:17px;} header{padding:10px;} .hright{gap:5px;} .cart-btn,.add-btn{padding:9px 11px;} .bal{padding:8px 9px;} }

  /* ===== Nút đóng (X) to, dễ bấm ===== */
  .close-x,.drawer-close{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.12);border:1px solid var(--line);
    color:var(--text);font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .close-x:hover,.drawer-close:hover{background:var(--pink);color:#fff;border-color:transparent;}
  .close-x{position:sticky;top:0;float:right;margin:-12px -8px 4px 10px;z-index:5;}
  .modal h3{min-height:34px;padding-right:8px;}
</style>
</head>
<body>
<header><div class="logo">filedrop</div>
  <div class="hright" id="headerRight">
    <button class="add-btn" onclick="openAuth('login')">Đăng nhập</button>
    <button class="cart-btn" onclick="toggleDrawer(true)">↓ <span class="lbl">giỏ hàng </span>(<span id="cartCount">0</span>)</button>
  </div>
</header>
<div class="hero"><h1>Tải file, không phải chờ đợi.</h1>
<p>Template, tài liệu và asset chất lượng — mua một lần, tải về ngay.</p></div>
<main><div class="grid" id="fileList">Đang tải sản phẩm…</div></main>
<footer>filedrop — kho file số &middot; <a href="/admin.html">Quản trị</a></footer>

<div class="overlay" id="overlay" onclick="toggleDrawer(false)"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head" style="display:flex;justify-content:space-between;align-items:center;"><h3 style="margin:0;font-family:var(--disp);">Giỏ hàng</h3><button class="drawer-close" onclick="toggleDrawer(false)" aria-label="Đóng giỏ hàng">✕</button></div>
  <div class="drawer-items" id="drawerItems"></div>
  <div class="drawer-foot">
    <div class="total-row"><span>Tổng cộng</span><span id="drawerTotal">0₫</span></div>
    <button class="checkout-btn" id="checkoutBtn" onclick="openCheckout()" disabled>Thanh toán</button>
  </div>
</aside>
<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalContent"></div></div>

<script>
const fmt = n => n === 0 ? 'Miễn phí' : n.toLocaleString('vi-VN') + '₫';
const fmtMoney = n => Number(n||0).toLocaleString('vi-VN') + '₫';
let PRODUCTS = [];
let cart = [];
let AUTH_TOKEN = localStorage.getItem('fd_user_token') || null;
let CURRENT_USER = null;

async function initAuth(){
  if(!AUTH_TOKEN) return;
  try{
    const res = await fetch('/api/me', {headers:{'Authorization':'Bearer '+AUTH_TOKEN}});
    if(!res.ok) throw new Error();
    CURRENT_USER = await res.json();
    renderHeaderUser();
  }catch(e){
    AUTH_TOKEN = null; localStorage.removeItem('fd_user_token');
  }
}
async function refreshMe(){
  try{
    const res = await fetch('/api/me', {headers:{'Authorization':'Bearer '+AUTH_TOKEN}});
    if(!res.ok) throw new Error();
    CURRENT_USER = await res.json();
    renderHeaderUser();
  }catch(e){ /* giữ nguyên dữ liệu cũ nếu lỗi mạng */ }
}
function renderHeaderUser(){
  document.getElementById('headerRight').innerHTML = `
    <button class="add-btn" onclick="openMyOrders()" title="Đơn hàng của tôi">📦<span class="lbl"> Đơn hàng của tôi</span></button>
    <button class="add-btn" onclick="openProfile()" style="border-color:var(--lime);" title="Hồ sơ">👤 <span class="uname">${CURRENT_USER.name}</span></button>
    <span class="bal">💰 ${fmtMoney(CURRENT_USER.balance)}</span>
    <button class="add-btn" onclick="logout()" title="Đăng xuất"><span class="lbl">Đăng xuất</span><span class="ico">⏻</span></button>
    <button class="cart-btn" onclick="toggleDrawer(true)">↓ <span class="lbl">giỏ hàng </span>(<span id="cartCount">${cart.length}</span>)</button>`;
}
function logout(){
  AUTH_TOKEN = null; CURRENT_USER = null;
  localStorage.removeItem('fd_user_token');
  document.getElementById('headerRight').innerHTML = `
    <button class="add-btn" onclick="openAuth('login')">Đăng nhập</button>
    <button class="cart-btn" onclick="toggleDrawer(true)">↓ <span class="lbl">giỏ hàng </span>(<span id="cartCount">${cart.length}</span>)</button>`;
}
function openAuth(mode){
  document.getElementById('modalContent').innerHTML = mode==='login' ? loginFormHTML() : registerFormHTML();
  document.getElementById('modalOverlay').classList.add('open');
}
function loginFormHTML(){
  return `
    <button class="close-x" onclick="closeModal()">&times;</button>
    <h3>Đăng nhập</h3>
    <p class="sub">Đăng nhập để xem lại đơn hàng và không phải nhập email mỗi lần mua.</p>
    <div class="field"><label>Tên đăng nhập hoặc email</label><input id="loginUser" type="text"></div>
    <div class="field"><label>Mật khẩu</label><input id="loginPass" type="password"></div>
    <p id="authErr" style="color:#ff6b6b;font-size:12px;display:none;"></p>
    <button class="checkout-btn" onclick="doLogin()">Đăng nhập</button>
    <p style="text-align:center;color:var(--muted);font-size:13px;margin-top:14px;">Chưa có tài khoản? <a onclick="openAuth('register')" style="color:var(--cyan);cursor:pointer;">Đăng ký</a></p>`;
}
function registerFormHTML(){
  return `
    <button class="close-x" onclick="closeModal()">&times;</button>
    <h3>Tạo tài khoản</h3>
    <div class="field"><label>Họ và tên</label><input id="regName" type="text"></div>
    <div class="field"><label>Tên đăng nhập</label><input id="regUsername" type="text"></div>
    <div class="field"><label>Email</label><input id="regEmail" type="email"></div>
    <div class="field"><label>Số điện thoại</label><input id="regPhone" type="tel"></div>
    <div class="field"><label>Mật khẩu</label><input id="regPass" type="password"></div>
    <p id="authErr" style="color:#ff6b6b;font-size:12px;display:none;"></p>
    <button class="checkout-btn" onclick="doRequestOtp()">Gửi mã xác thực</button>
    <p style="text-align:center;color:var(--muted);font-size:13px;margin-top:14px;">Đã có tài khoản? <a onclick="openAuth('login')" style="color:var(--cyan);cursor:pointer;">Đăng nhập</a></p>`;
}
function otpFormHTML(email){
  return `
    <button class="close-x" onclick="closeModal()">&times;</button>
    <h3>Nhập mã xác thực</h3>
    <p class="sub">Mã gồm 6 số vừa được gửi tới <strong style="color:var(--text)">${email}</strong>. Kiểm tra cả mục Spam nếu chưa thấy.</p>
    <div class="field"><label>Mã OTP</label><input id="otpCode" type="text" maxlength="6" placeholder="6 số"></div>
    <p id="authErr" style="color:#ff6b6b;font-size:12px;display:none;"></p>
    <button class="checkout-btn" onclick="doVerifyOtp('${email}')">Xác nhận</button>
    <p style="text-align:center;color:var(--muted);font-size:13px;margin-top:14px;">Không nhận được mã? <a onclick="openAuth('register')" style="color:var(--cyan);cursor:pointer;">Đăng ký lại</a></p>`;
}
function showAuthErr(msg){ const e=document.getElementById('authErr'); e.textContent=msg; e.style.display='block'; }
async function doLogin(){
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  const res = await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
  const data = await res.json();
  if(!res.ok) return showAuthErr(data.error||'Lỗi đăng nhập');
  AUTH_TOKEN = data.token; CURRENT_USER = data.user;
  localStorage.setItem('fd_user_token', AUTH_TOKEN);
  closeModal(); renderHeaderUser();
}
async function doRequestOtp(){
  const body = {
    name: document.getElementById('regName').value.trim(),
    username: document.getElementById('regUsername').value.trim(),
    email: document.getElementById('regEmail').value.trim(),
    phone: document.getElementById('regPhone').value.trim(),
    password: document.getElementById('regPass').value,
  };
  const res = await fetch('/api/register/request-otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const data = await res.json();
  if(!res.ok) return showAuthErr(data.error||'Lỗi gửi mã OTP');
  document.getElementById('modalContent').innerHTML = otpFormHTML(body.email);
}
async function doVerifyOtp(email){
  const code = document.getElementById('otpCode').value.trim();
  const res = await fetch('/api/register/verify-otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,code})});
  const data = await res.json();
  if(!res.ok) return showAuthErr(data.error||'Mã OTP không đúng');
  AUTH_TOKEN = data.token; CURRENT_USER = data.user;
  localStorage.setItem('fd_user_token', AUTH_TOKEN);
  closeModal(); renderHeaderUser();
}
async function openProfile(){
  await refreshMe();
  document.getElementById('modalContent').innerHTML = `
    <button class="close-x" onclick="closeModal()">&times;</button>
    <h3>Hồ sơ của tôi</h3>
    <div style="background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:18px;font-size:13.5px;line-height:2;">
      <div><span style="color:var(--muted);">Họ tên:</span> ${CURRENT_USER.name}</div>
      <div><span style="color:var(--muted);">Tên đăng nhập:</span> ${CURRENT_USER.username}</div>
      <div><span style="color:var(--muted);">Email:</span> ${CURRENT_USER.email}</div>
      <div><span style="color:var(--muted);">Số điện thoại:</span> ${CURRENT_USER.phone || '—'}</div>
      <div><span style="color:var(--muted);">Số dư ví:</span> <strong style="color:var(--lime);">${fmtMoney(CURRENT_USER.balance)}</strong></div>
    </div>
    <h3 style="font-size:16px;">Đổi mật khẩu</h3>
    <div class="field"><label>Mật khẩu hiện tại</label><input id="curPass" type="password"></div>
    <div class="field"><label>Mật khẩu mới (tối thiểu 6 ký tự)</label><input id="newPass" type="password"></div>
    <div class="field"><label>Nhập lại mật khẩu mới</label><input id="newPass2" type="password"></div>
    <p id="pwMsg" style="font-size:12px;display:none;"></p>
    <button class="checkout-btn" onclick="doChangePassword()">Đổi mật khẩu</button>`;
  document.getElementById('modalOverlay').classList.add('open');
}
async function doChangePassword(){
  const currentPassword = document.getElementById('curPass').value;
  const newPassword = document.getElementById('newPass').value;
  const newPassword2 = document.getElementById('newPass2').value;
  const msg = document.getElementById('pwMsg');
  msg.style.color = '#ff6b6b';
  if(newPassword !== newPassword2){ msg.textContent='Mật khẩu mới nhập lại không khớp'; msg.style.display='block'; return; }
  const res = await fetch('/api/me/password',{method:'PUT',headers:{'Content-Type':'application/json','Authorization':'Bearer '+AUTH_TOKEN},
    body:JSON.stringify({currentPassword,newPassword})});
  const data = await res.json();
  if(!res.ok){ msg.textContent = data.error||'Có lỗi xảy ra'; msg.style.display='block'; return; }
  msg.style.color = 'var(--lime)'; msg.textContent = 'Đổi mật khẩu thành công!'; msg.style.display='block';
  document.getElementById('curPass').value=''; document.getElementById('newPass').value=''; document.getElementById('newPass2').value='';
}
async function openMyOrders(){
  const res = await fetch('/api/my-orders',{headers:{'Authorization':'Bearer '+AUTH_TOKEN}});
  const orders = await res.json();
  document.getElementById('modalContent').innerHTML = `
    <button class="close-x" onclick="closeModal()">&times;</button>
    <h3>Đơn hàng của tôi</h3>
    <div style="max-height:340px;overflow-y:auto;">
    ${orders.length ? orders.slice().reverse().map(o => `
      <div style="border-bottom:1px solid var(--line);padding:12px 0;font-size:13px;">
        <div>${o.items.map(it => it.name).join(', ')}</div>
        <div style="color:var(--muted);font-family:var(--disp);font-size:11px;margin-top:4px;">
          ${fmt(o.total)} &middot; ${new Date(o.createdAt).toLocaleString('vi-VN')} &middot;
          <span style="color:${o.status==='completed'?'var(--lime)':o.status==='rejected'?'#ff6b6b':'#ffd23f'}">${o.status}</span>
        </div>
        ${o.status==='completed' ? `
          <div style="margin-top:8px;display:flex;flex-direction:column;gap:6px;">
            ${o.items.map(it => it.fileUrl
              ? `<a href="${it.fileUrl}" target="_blank" rel="noopener" style="color:var(--cyan);font-family:var(--disp);font-size:12px;">⬇ Tải "${it.name}"</a>`
              : `<span style="color:var(--muted);font-size:12px;">"${it.name}" — chưa có link tải, liên hệ shop để nhận file.</span>`
            ).join('')}
          </div>` : ''}
      </div>`).join('') : '<p style="color:var(--muted)">Bạn chưa có đơn hàng nào.</p>'}
    </div>`;
  document.getElementById('modalOverlay').classList.add('open');
}


async function loadSiteSettings(){
  try{
    const s = await fetch('/api/settings').then(r=>r.json());
    document.querySelector('.logo').textContent = s.siteName || 'filedrop';
    document.querySelector('.hero h1').textContent = s.heroTitle || '';
    document.querySelector('.hero p').textContent = s.heroSubtitle || '';
    document.title = s.siteName || 'filedrop';
    const root = document.documentElement.style;
    if(s.colors){
      if(s.colors.bg) root.setProperty('--bg', s.colors.bg);
      if(s.colors.pink) root.setProperty('--pink', s.colors.pink);
      if(s.colors.cyan) root.setProperty('--cyan', s.colors.cyan);
      if(s.colors.lime) root.setProperty('--lime', s.colors.lime);
    }
    const footerSpan = document.querySelector('footer');
    if(footerSpan && s.footerText){
      footerSpan.innerHTML = `${s.footerText} &middot; <a href="/admin.html">Quản trị</a>`;
    }
  }catch(e){ /* dùng mặc định nếu lỗi */ }
}

async function loadProducts(){
  const res = await fetch('/api/products');
  PRODUCTS = await res.json();
  renderFiles();
}
function renderFiles(){
  document.getElementById('fileList').innerHTML = PRODUCTS.map(f => `
    <div class="card">
      <div class="card-top"><span class="ext">${f.ext}</span><span class="price">${fmt(f.price)}</span></div>
      <div class="name">${f.name}</div><div class="desc">${f.desc}</div>
      <div class="bottom"><span class="size">${f.size}</span>
        <button class="add-btn ${cart.includes(f.id)?'added':''}" onclick="addToCart(${f.id})">${cart.includes(f.id)?'✓ Đã thêm':'+ Thêm'}</button>
      </div>
    </div>`).join('') || '<p style="color:var(--muted)">Chưa có sản phẩm nào.</p>';
}
function addToCart(id){ if(!cart.includes(id)){ cart.push(id); renderFiles(); renderCart(); } }
function removeFromCart(id){ cart = cart.filter(x=>x!==id); renderFiles(); renderCart(); }
function renderCart(){
  document.getElementById('cartCount').textContent = cart.length;
  const items = PRODUCTS.filter(f=>cart.includes(f.id));
  document.getElementById('drawerItems').innerHTML = items.length ? items.map(f=>`
    <div class="drawer-item"><span>${f.name}</span><button class="rm" onclick="removeFromCart(${f.id})">xoá</button></div>`).join('')
    : '<p style="color:var(--muted);text-align:center;padding:30px 0;">Giỏ hàng trống.</p>';
  const total = items.reduce((s,f)=>s+f.price,0);
  document.getElementById('drawerTotal').textContent = fmt(total);
  document.getElementById('checkoutBtn').disabled = items.length===0;
}
function toggleDrawer(open){
  document.getElementById('overlay').classList.toggle('open',open);
  document.getElementById('drawer').classList.toggle('open',open);
}
let payMethod='card';
async function openCheckout(){
  const items = PRODUCTS.filter(f=>cart.includes(f.id));
  const total = items.reduce((s,f)=>s+f.price,0);
  payMethod='card';
  if(AUTH_TOKEN){ await refreshMe(); } // lấy số dư ví mới nhất trước khi mở thanh toán
  document.getElementById('modalContent').innerHTML = `
    <button class="close-x" onclick="closeModal()">&times;</button>
    <h3>Xác nhận đơn hàng</h3>
    <p class="sub">${items.length} file &middot; đơn sẽ được duyệt thủ công, link tải gửi qua email.</p>
    <div class="field"><label>Email nhận link tải</label><input id="emailInput" type="email" placeholder="ban@vidu.com" value="${CURRENT_USER?CURRENT_USER.email:''}"></div>
    <div class="pay-tabs">
      <button class="pay-tab active" id="tab-card" onclick="switchPay('card')">Thẻ ngân hàng</button>
      <button class="pay-tab" id="tab-scratch" onclick="switchPay('scratch')">Thẻ cào</button>
      <button class="pay-tab" id="tab-balance" onclick="switchPay('balance')">Số dư ví</button>
    </div>
    <div id="payFields"></div>
    <div style="font-family:var(--disp);color:var(--muted);margin-bottom:16px;">Tổng: <strong style="color:var(--text)">${fmt(total)}</strong></div>
    <button class="checkout-btn" onclick="submitOrder(${JSON.stringify(items.map(i=>i.id))},${total})">Gửi đơn hàng</button>`;
  renderPayFields();
  document.getElementById('modalOverlay').classList.add('open');
}
function switchPay(m){ payMethod=m;
  document.getElementById('tab-card').classList.toggle('active',m==='card');
  document.getElementById('tab-scratch').classList.toggle('active',m==='scratch');
  document.getElementById('tab-balance').classList.toggle('active',m==='balance');
  renderPayFields();
}
function renderPayFields(){
  const el=document.getElementById('payFields');
  if(payMethod==='card'){
    el.innerHTML = `<div class="field"><label>Số thẻ</label><input id="cardNo" placeholder="4242 4242 4242 4242"></div>`;
  } else if(payMethod==='scratch'){
    el.innerHTML = `<div class="field"><label>Nhà mạng</label><select id="carrier"><option>Viettel</option><option>Mobifone</option><option>Vinaphone</option></select></div>
       <div class="field"><label>Số serial</label><input id="serial" placeholder="Dãy số in trên thẻ"></div>
       <div class="field"><label>Mã thẻ</label><input id="pin" placeholder="Mã sau khi cào"></div>`;
  } else {
    el.innerHTML = CURRENT_USER
      ? `<p style="color:var(--muted);font-size:13px;">Số dư hiện tại: <strong style="color:var(--lime)">${fmtMoney(CURRENT_USER.balance)}</strong>. Số tiền đơn hàng sẽ được trừ trực tiếp, không cần nhập gì thêm.</p>`
      : `<p style="color:#ff6b6b;font-size:13px;">Bạn cần <a onclick="closeModal();openAuth('login')" style="color:var(--cyan);cursor:pointer;">đăng nhập</a> để dùng số dư ví.</p>`;
  }
}
async function submitOrder(itemIds, total){
  const email = document.getElementById('emailInput').value.trim();
  if(!email) return;
  if(payMethod==='balance' && !CURRENT_USER) return showAuthErrTop('Bạn cần đăng nhập để dùng số dư ví.');
  let paymentDetail = {};
  if(payMethod==='scratch'){
    paymentDetail = {carrier:document.getElementById('carrier').value, serial:document.getElementById('serial').value, pin:document.getElementById('pin').value};
  } else if(payMethod==='card'){
    paymentDetail = {cardNo:document.getElementById('cardNo').value};
  }
  const res = await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json', ...(AUTH_TOKEN?{'Authorization':'Bearer '+AUTH_TOKEN}:{})},
    body:JSON.stringify({email,itemIds,paymentMethod:payMethod,paymentDetail,total})});
  const data = await res.json();
  if(!res.ok) return showAuthErrTop(data.error||'Có lỗi xảy ra, thử lại nhé.');
  if(payMethod==='balance' && CURRENT_USER){ CURRENT_USER.balance = (CURRENT_USER.balance||0) - total; renderHeaderUser(); }
  const doneMsg = data.status==='completed'
    ? 'Thanh toán bằng ví thành công, đơn hàng đã hoàn tất!'
    : `Chúng tôi sẽ kiểm tra thanh toán và gửi link tải qua <strong style="color:var(--text)">${email}</strong>.`;
  document.getElementById('modalContent').innerHTML = `
    <div style="text-align:center;">
      <div style="font-size:40px;margin-bottom:12px;">🎉</div>
      <h3>Đã nhận đơn hàng</h3>
      <p style="color:var(--muted);">Mã đơn: <strong style="color:var(--text)">${data.orderId||'—'}</strong><br>${doneMsg}</p>
      <button class="checkout-btn" style="margin-top:16px;" onclick="closeModal();cart=[];renderFiles();renderCart();toggleDrawer(false);">Đóng</button>
    </div>`;
}
function showAuthErrTop(msg){
  const el = document.getElementById('payFields');
  if(el) el.insertAdjacentHTML('afterend', `<p style="color:#ff6b6b;font-size:12px;">${msg}</p>`);
  else alert(msg);
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); }
document.getElementById('modalOverlay').addEventListener('click',e=>{if(e.target.id==='modalOverlay')closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();toggleDrawer(false);}});
loadSiteSettings();
loadProducts();
initAuth();
</script>
</body>
</html>
